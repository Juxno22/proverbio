<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensaje</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      background: #F5F5F7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }

    .tarjeta {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 20px;
      padding: 40px 36px;
      text-align: center;
      box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.06);
    }

    .etiqueta {
      margin: 0 0 6px 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #86868b;
    }

    h1 {
      margin: 0 0 22px 0;
      font-size: 22px;
      font-weight: 600;
      color: #1d1d1f;
    }

    .vista-previa {
      background: #F5F5F7;
      border-radius: 14px;
      padding: 20px 18px;
      margin-bottom: 26px;
    }

    .vista-previa blockquote {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
      color: #1d1d1f;
    }

    .vista-previa .referencia {
      margin: 10px 0 0 0;
      font-size: 13px;
      color: #86868b;
    }

    .boton-principal {
      width: 100%;
      border: none;
      background: #007AFF;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      padding: 14px 20px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 122, 255, 0.28);
      transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }

    .boton-principal:hover:not(:disabled) {
      background: #0066d6;
    }

    .boton-principal:active:not(:disabled) {
      transform: translateY(1px);
    }

    .boton-principal:disabled {
      background: #d1d1d6;
      color: #8e8e93;
      cursor: default;
      box-shadow: none;
    }

    .contador {
      margin: 14px 0 0 0;
      font-size: 13px;
      color: #86868b;
    }

    .nota {
      margin: 18px 0 0 0;
      font-size: 12px;
      color: #a1a1a6;
    }

    .aviso {
      margin: 16px 0 0 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255, 59, 48, 0.08);
      color: #d70015;
      font-size: 13px;
      line-height: 1.4;
      text-align: left;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="tarjeta">
    <p class="etiqueta">Una frase al dia.</p>
    <h1>Un mensaje flotante, que necesites escuchar.</h1>

    <div class="vista-previa">
      <blockquote id="vista-previa-texto">Cargando…</blockquote>
      <p class="referencia" id="vista-previa-ref"></p>
    </div>

    <button id="btn-abrir" class="boton-principal" type="button">Abrir mensaje flotante</button>
    <p class="contador" id="contador"></p>

    <p class="aviso" id="aviso-compatibilidad" hidden></p>
  </main>

    const CLAVE_ESTADO = "proverbio_flotante_estado_v1";
    const UNA_HORA_MS = 60 * 60 * 1000;

    function barajar(lista) {
      const copia = lista.slice();
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    function indicesCompletos() {
      return PROVERBIOS.map((_, i) => i);
    }

    function crearEstadoInicial() {
      const bolsa = barajar(indicesCompletos());
      const indiceActual = bolsa.shift();
      return {
        indiceActual: indiceActual,
        bolsa: bolsa,
        proximoCambio: Date.now() + UNA_HORA_MS
      };
    }

    function cargarEstado() {
      try {
        const guardado = sessionStorage.getItem(CLAVE_ESTADO);
        if (!guardado) return crearEstadoInicial();
        const datos = JSON.parse(guardado);
        const esValido =
          typeof datos.indiceActual === "number" &&
          Array.isArray(datos.bolsa) &&
          typeof datos.proximoCambio === "number" &&
          datos.indiceActual >= 0 &&
          datos.indiceActual < PROVERBIOS.length;
        return esValido ? datos : crearEstadoInicial();
      } catch (error) {
        return crearEstadoInicial();
      }
    }

    function guardarEstado() {
      sessionStorage.setItem(CLAVE_ESTADO, JSON.stringify(estado));
    }

    let estado = cargarEstado();
    guardarEstado();

    function proverbioActual() {
      return PROVERBIOS[estado.indiceActual];
    }

    function siguienteProverbio() {
      if (estado.bolsa.length === 0) {
        let nuevaBolsa = barajar(indicesCompletos()).filter(i => i !== estado.indiceActual);
        estado.bolsa = nuevaBolsa.length > 0 ? nuevaBolsa : barajar(indicesCompletos());
      }
      estado.indiceActual = estado.bolsa.shift();
      estado.proximoCambio = Date.now() + UNA_HORA_MS;
      guardarEstado();
      actualizarVistas();
    }

    const btnAbrir = document.getElementById("btn-abrir");
    const vistaTexto = document.getElementById("vista-previa-texto");
    const vistaRef = document.getElementById("vista-previa-ref");
    const contadorEl = document.getElementById("contador");
    const avisoCompat = document.getElementById("aviso-compatibilidad");

    function actualizarVistaPrincipal() {
      const p = proverbioActual();
      vistaTexto.textContent = "\u201C" + p.texto + "\u201D";
      vistaRef.textContent = p.referencia;
    }

    function actualizarContador() {
      const restanteMs = Math.max(0, estado.proximoCambio - Date.now());
      const minutos = Math.ceil(restanteMs / 60000);
      if (restanteMs <= 0) {
        contadorEl.textContent = "Actualizando…";
      } else if (minutos <= 1) {
        contadorEl.textContent = "Próximo proverbio en 1 min";
      } else {
        contadorEl.textContent = "Próximo proverbio en " + minutos + " min";
      }
    }

      }
      .pip-contenedor {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: rgba(255, 255, 255, 0.92);
        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);
        border-radius: 16px;
        box-shadow: 0px 8px 32px rgba(0, 0, 0, 0.12);
      }
      .pip-texto {
        margin: 0;
        color: #1d1d1f;
        font-size: 17px;
        line-height: 1.5;
        max-height: 150px;
        overflow: hidden;
      }
      .pip-referencia {
        margin: 12px 0 0 0;
        color: #86868b;
        font-size: 13px;
      }
      .pip-siguiente {
        position: absolute;
        right: 12px;
        bottom: 12px;
        width: 34px;
        height: 34px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(0, 122, 255, 0.10);
        color: #007AFF;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        transition: background-color 0.15s ease, transform 0.15s ease;
      }
      .pip-siguiente:hover {
        background: rgba(0, 122, 255, 0.18);
        transform: scale(1.06);
      }
      .pip-siguiente:active {
        transform: scale(0.94);
      }
    `;
    }

    function pintarProverbioEnPip() {
      if (!nodosPip) return;
      const p = proverbioActual();
      nodosPip.texto.textContent = "\u201C" + p.texto + "\u201D";
      nodosPip.referencia.textContent = p.referencia;
    }

    function construirContenidoPip(documentoPip) {
      const contenedor = documentoPip.createElement("div");
      contenedor.className = "pip-contenedor";

      const parrafoTexto = documentoPip.createElement("p");
      parrafoTexto.className = "pip-texto";

      const parrafoRef = documentoPip.createElement("p");
      parrafoRef.className = "pip-referencia";

      const botonSiguiente = documentoPip.createElement("button");
      botonSiguiente.type = "button";
      botonSiguiente.className = "pip-siguiente";
      botonSiguiente.setAttribute("aria-label", "Siguiente proverbio");
      botonSiguiente.title = "Siguiente proverbio";
      botonSiguiente.textContent = "→";
      botonSiguiente.addEventListener("click", siguienteProverbio);

      contenedor.appendChild(parrafoTexto);
      contenedor.appendChild(parrafoRef);
      contenedor.appendChild(botonSiguiente);
      documentoPip.body.appendChild(contenedor);

      nodosPip = { texto: parrafoTexto, referencia: parrafoRef };
    }

    function activarBotonPrincipal() {
      btnAbrir.disabled = false;
      btnAbrir.textContent = "Abrir proverbio flotante";
    }

    function desactivarBotonPrincipal() {
      btnAbrir.disabled = true;
      btnAbrir.textContent = "Proverbio flotante abierto";
    }

    async function abrirVentanaFlotante() {
      if (!("documentPictureInPicture" in window)) return;

      if (ventanaPip) {
        ventanaPip.focus();
        return;
      }

      desactivarBotonPrincipal();

      try {
        ventanaPip = await documentPictureInPicture.requestWindow({
          width: 360,
          height: 240
        });
      } catch (error) {
        console.error("No se pudo abrir la ventana flotante:", error);
        activarBotonPrincipal();
        return;
      }

      const estiloInyectado = ventanaPip.document.createElement("style");
      estiloInyectado.textContent = obtenerEstilosPip();
      ventanaPip.document.head.appendChild(estiloInyectado);

      construirContenidoPip(ventanaPip.document);
      pintarProverbioEnPip();

      ventanaPip.addEventListener(
        "pagehide",
        () => {
          ventanaPip = null;
          nodosPip = null;
          activarBotonPrincipal();
        },
        { once: true }
      );
    }

    function actualizarVistas() {
      actualizarVistaPrincipal();
      pintarProverbioEnPip();
      actualizarContador();
    }

    setInterval(() => {
      if (Date.now() >= estado.proximoCambio) {
        siguienteProverbio();
      } else {
        actualizarContador();
      }
    }, 15000);

    btnAbrir.addEventListener("click", abrirVentanaFlotante);

    if (!("documentPictureInPicture" in window)) {
      btnAbrir.disabled = true;
      avisoCompat.hidden = false;
      avisoCompat.textContent =
        "Tu navegador no soporta la función \u201CImagen en imagen para documentos\u201D. " +
        "Prueba a abrir esta página con la última versión de Chrome o Edge (116 o superior).";
    }

    actualizarVistas();
  </script>
</body>

</html>
